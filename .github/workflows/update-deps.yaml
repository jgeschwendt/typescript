name: update-deps

# app credentials, not GITHUB_TOKEN: its PRs and auto-merges trigger no workflows
# a hold (a pin ncu must not bump) goes in .ncurc.yaml's `reject` list
on:
  schedule:
    - cron: '27 9 * * *'
  workflow_dispatch:

concurrency:
  cancel-in-progress: false
  group: update-deps

permissions:
  actions: read
  contents: write
  id-token: write
  pull-requests: write

jobs:
  ship:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # one open PR at a time: yesterday's red PR is being repaired, not superseded
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(gh pr list -R "$GITHUB_REPOSITORY" --head update-deps --state open --json number --jq '.[].number')" ]; then
            echo "open update-deps PR still pending — not stacking a second"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v5

      - if: steps.guard.outputs.skip != 'true'
        uses: jdx/mise-action@v2

      - if: steps.guard.outputs.skip != 'true'
        id: bump
        run: |
          bun run update

          if git diff --quiet; then
            echo "already at latest — nothing to ship"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.bump.outputs.changed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_args: --model sonnet --allowedTools "Bash(git:*),Bash(gh:*)"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            The working tree carries today's dependency bump (`bun run
            update`) — already run. Change no files; your job is only to
            ship what is here:

            1. `git checkout -b update-deps`
            2. `git commit --no-verify -am "task(//): deps — daily update"`
               (--no-verify: hooks are not installed in this runner; the PR's
               required checks cover everything they would)
            3. `git push -f origin update-deps`
            4. `gh pr create --head update-deps --title "task(//): deps — daily update"`
               with a short body: the notable version bumps read from the
               package.json diff, plus the line "Auto-merges on green; a red
               run is repaired on this branch by the `github-failures`
               routine."
            5. `gh pr merge update-deps --auto --rebase`
