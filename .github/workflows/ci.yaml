name: ci

on:
  # labeled/unlabeled: applying `release:signed-off` re-runs the changeset guard
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ci-${{ github.event.pull_request.number || github.ref }}

jobs:
  # main's ruleset requires status context `check` (this job id): renaming it blocks every merge
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # stele freshness walks git blame over anchored code
          fetch-depth: 0
      - uses: jdx/mise-action@v2

      - run: bun install --frozen-lockfile
      - run: bunx oxfmt --check
      - run: bunx oxlint
      - run: bun test
      # ※ verax-type-tests
      # verax's type-level tests (`true satisfies Equal<…>`) only fail under tsc.
      # Run inside the package so bunx resolves the lockfile's compiler.
      - run: bunx tsc --noEmit
        working-directory: packages/verax

      # ※ changeset-guard
      # grep, not rg (absent on the runner); `.?` around the name absorbs any quote style
      - name: changeset guard
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          SIGNED_OFF: ${{ contains(github.event.pull_request.labels.*.name, 'release:signed-off') }}
        run: |
          bump() {
            grep -rEl --include='*.md' --exclude=README.md \
              "^[[:space:]]*.?(@jlg/[a-z]+|verax).?[[:space:]]*:[[:space:]]*$1[[:space:]]*\$" \
              .changeset || true
          }
          # any verax changeset or version change needs the sign-off, patch included (owner 2026-10-22)
          verax() { grep -rEl --include='*.md' --exclude=README.md '^[[:space:]]*.?verax.?[[:space:]]*:' .changeset || true; }
          majors=$(bump major)
          if [ -n "$majors" ]; then
            echo "::error::major bump forbidden pre-1.0 — rewrite as minor (breaking) or patch: $majors"
            exit 1
          fi
          [ "$EVENT" = pull_request ] || exit 0
          unsigned="$(bump minor; verax)"
          for f in packages/*/package.json; do
            old=$(git show "$BASE:$f" 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' 2>/dev/null) || continue
            new=$(node -p "require('./$f').version")
            [ "$old" = "$new" ] && continue
            # a downgrade (a corrected bump) counts as patch
            kind=$(node -p 'const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); b[0] > a[0] ? "major" : b[0] === a[0] && b[1] > a[1] ? "minor" : "patch"' "$old" "$new")
            [ "$kind" = patch ] && [ "$f" != packages/verax/package.json ] || unsigned="$unsigned $f ($old -> $new, $kind)"
          done
          if [ -n "$unsigned" ] && [ "$SIGNED_OFF" != true ]; then
            echo "::error::minor/major (or any verax) release needs the owner's sign-off — apply the release:signed-off label: $unsigned"
            exit 1
          fi

      # pinned to the stele that built the lock; never `stele build` in CI, it launders staleness
      - run: curl -fsSL https://raw.githubusercontent.com/jgeschwendt/stele/main/scripts/install.sh | bash -s v0.3.0
      - run: ~/.local/bin/stele check
      - run: ~/.local/bin/stele emit --check
