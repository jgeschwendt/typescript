name: ci

on:
  # labeled/unlabeled: applying `release:signed-off` re-runs the changeset guard
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
  push:
    branches:
      - main
  workflow_dispatch:

# The branch ruleset on main requires the status check whose context is exactly
# `check` — the job id below. Renaming the job breaks every PR's merge gate.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: ci-${{ github.event.pull_request.number || github.ref }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # stele freshness walks git blame over the anchored code — needs full history.
          fetch-depth: 0
      - uses: jdx/mise-action@v2

      - run: bun install --frozen-lockfile
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun test

      # ※ changeset-guard
      # MINIMUM BUMP: pre-1.0 a breaking change is a `minor` changeset and
      # everything else is `patch`; `major` is forbidden until a deliberate 1.0,
      # so a `major` in any pending changeset fails this job.
      # SIGN-OFF: on a pull request, a `minor` — as a pending changeset, or as a
      # package.json version moving past its patch component (the Version
      # Packages PR) — fails this required check until the owner applies the
      # `release:signed-off` label, which re-runs it. That label IS the owner's
      # sign-off; agents never apply it. Patch releases need nothing.
      # grep, not rg — ripgrep is not on the runner and mise pins only bun and
      # node. The optional `.` before and after the package name absorbs
      # whichever quote style the changeset carries (`@jlg/oxlint:`,
      # `'@jlg/oxlint':`, `"…":`).
      - name: changeset guard
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          SIGNED_OFF: ${{ contains(github.event.pull_request.labels.*.name, 'release:signed-off') }}
        run: |
          bump() {
            grep -rEl --include='*.md' --exclude=README.md \
              "^[[:space:]]*.?@jlg/[a-z]+.?[[:space:]]*:[[:space:]]*$1[[:space:]]*\$" \
              .changeset || true
          }
          majors=$(bump major)
          if [ -n "$majors" ]; then
            echo "::error::major bump forbidden pre-1.0 — rewrite as minor (breaking) or patch: $majors"
            exit 1
          fi
          [ "$EVENT" = pull_request ] || exit 0
          unsigned="$(bump minor)"
          for f in packages/*/package.json; do
            old=$(git show "$BASE:$f" 2>/dev/null | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' 2>/dev/null) || continue
            new=$(node -p "require('./$f').version")
            # only an upward minor or major move needs sign-off; patches and
            # downgrades (a corrected bump) pass
            kind=$(node -p 'const [a, b] = process.argv.slice(1).map((v) => v.split(".").map(Number)); b[0] > a[0] ? "major" : b[0] === a[0] && b[1] > a[1] ? "minor" : "patch"' "$old" "$new")
            [ "$kind" = patch ] || unsigned="$unsigned $f ($old -> $new, $kind)"
          done
          if [ -n "$unsigned" ] && [ "$SIGNED_OFF" != true ]; then
            echo "::error::minor/major release needs the owner's sign-off — apply the release:signed-off label: $unsigned"
            exit 1
          fi

      # stele: assert the agent-doc graph is fresh (anchors resolve, claims not
      # staled by drift) and the committed AGENTS.md / index files match the lock.
      # Pinned to the binary the lock was built with; CI never runs `stele build`
      # (that would launder staleness). liveness resolves the nodes' `bun`/`bunx`
      # commands against the PATH mise-action set up above.
      - run: curl -fsSL https://raw.githubusercontent.com/jgeschwendt/stele/main/scripts/install.sh | bash -s v0.3.0
      - run: ~/.local/bin/stele check
      - run: ~/.local/bin/stele emit --check
