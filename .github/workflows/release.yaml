# npm trusted publishers name this file: renaming it silently breaks OIDC publishing
# ENEEDAUTH despite a publisher: `npm trust revoke` then `npm trust github` (observed 2026-10-09)
name: release

on:
  push:
    branches:
      - main

permissions: {}

# a cancelled publish can leave some packages released and others not
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # changesets reads git history; full depth keeps every job's view identical
          fetch-depth: 0
          persist-credentials: false
      # node 24 (npm 11.9) for OIDC publishing: never shadow node with bun
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      # ※ release-app-token
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # ※ release-approval-gate
      # must read the changesets before `changeset version` consumes them
      - id: bumps
        run: |
          if grep -rEq --include='*.md' --exclude=README.md \
            '^[[:space:]]*.?@jlg/[a-z]+.?[[:space:]]*:[[:space:]]*(minor|major)[[:space:]]*$' \
            .changeset; then
            echo "gated=true" >> "$GITHUB_OUTPUT"
          fi

      - id: version
        uses: changesets/action/version@v2
        with:
          commit-message: 'task(//): version packages'
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: 'task(//): version packages'
          script: bun run version-packages

      - if: steps.version.outputs.pr-number != '' && steps.bumps.outputs.gated != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge ${{ steps.version.outputs.pr-number }} --auto --squash

      - if: steps.version.outputs.pr-number != '' && steps.bumps.outputs.gated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr edit ${{ steps.version.outputs.pr-number }} --add-reviewer jgeschwendt || true

  # no id-token here, so publish is the only job holding an OIDC credential
  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - uses: changesets/action/publish@v2
        with:
          # npm is the release record; git tags still mark each version
          create-github-releases: false
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
