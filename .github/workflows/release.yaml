# The npm trusted publisher configured for each of @jlg/oxfmt, @jlg/oxlint and
# @jlg/tsconfig names this file — `release.yaml`, extension included. Renaming or
# moving it silently breaks OIDC publishing; re-point the publisher first.
name: release

on:
  push:
    branches:
      - main

permissions: {}

# Never cancel a release mid-flight: a cancelled publish can leave some packages
# on the registry and others not.
concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Reads the pending changesets and decides what this push is: `version` (open
  # or refresh the Version Packages PR), `publish` (versions are already bumped
  # — pack and ship), or `none`.
  select-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # changesets reads git history to decide what changed; full history keeps
          # every job's view identical.
          fetch-depth: 0
          persist-credentials: false
      # mise pins node 24 (npm 11.9), which the publish job needs for OIDC — no
      # bun→node symlink anywhere in this workflow, unlike ci.yaml: shadowing node
      # with bun would take npm's trusted-publishing path out of the picture.
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - id: select-mode
        uses: changesets/action/select-mode@v2

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile

      # ※ release-app-token
      # VERSION PR TOKEN — the Version Packages PR must be opened with this app
      # token, never GITHUB_TOKEN. GitHub raises no workflow events for anything
      # GITHUB_TOKEN creates, so a PR opened with it never runs ci.yaml, its
      # required `check` context never reports, and the PR can never merge.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          permission-contents: write
          permission-pull-requests: write
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # ※ release-approval-gate
      # RELEASE APPROVAL — a patch release lands on its own; a minor (or, after
      # 1.0, a major) waits for the owner: this step reads the pending changesets
      # BEFORE `changeset version` consumes them, and the auto-merge step below is
      # skipped when any of them bumps more than patch. The Version Packages PR
      # then sits with a review request until it is merged by hand — that merge is
      # the approval. Patch should almost always be the answer.
      - id: bumps
        run: |
          if grep -rEq --include='*.md' --exclude=README.md \
            '^[[:space:]]*.?@jlg/[a-z]+.?[[:space:]]*:[[:space:]]*(minor|major)[[:space:]]*$' \
            .changeset; then
            echo "gated=true" >> "$GITHUB_OUTPUT"
          fi

      - id: version
        uses: changesets/action/version@v2
        with:
          commit-message: 'task(//): version packages'
          github-token: ${{ steps.app-token.outputs.token }}
          pr-title: 'task(//): version packages'
          script: bun run version-packages

      # Patch only: hands the PR to GitHub's merge queue-of-one, so it lands
      # itself the moment `check` goes green and the release needs no second
      # human action.
      - if: steps.version.outputs.pr-number != '' && steps.bumps.outputs.gated != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr merge ${{ steps.version.outputs.pr-number }} --auto --squash

      # Minor or major: no auto-merge; ask the owner to review, and let the
      # merge be the approval.
      - if: steps.version.outputs.pr-number != '' && steps.bumps.outputs.gated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr edit ${{ steps.version.outputs.pr-number }} --add-reviewer jgeschwendt || true

  # Packs the tarballs in a job with no id-token, so the publish job below is the
  # only place an OIDC credential exists.
  pack:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    runs-on: ubuntu-latest
    outputs:
      pack-dir-artifact-id: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - id: pack
        uses: changesets/action/pack@v2
        with:
          publish-plan-artifact-id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      # The only job in this workflow with id-token: npm mints its trusted-publisher
      # credential from this OIDC token, and provenance attestation comes with it —
      # no --provenance flag, no NODE_AUTH_TOKEN, no npm secret anywhere.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      - uses: changesets/action/publish@v2
        with:
          create-github-releases: true
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack-dir-artifact-id }}
