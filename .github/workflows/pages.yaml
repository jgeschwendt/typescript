name: pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yaml
      - packages/oxlint/__tests__/rules.html
      - packages/oxlint/__tests__/ui.css
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

# a newer push supersedes a queued deploy, never an in-flight one
concurrency:
  cancel-in-progress: false
  group: pages

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # the report is committed, generated by `bun run --filter '@jlg/oxlint' report`
      - name: site
        run: |
          mkdir site
          cp packages/oxlint/__tests__/rules.html site/index.html
          cp packages/oxlint/__tests__/ui.css site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
