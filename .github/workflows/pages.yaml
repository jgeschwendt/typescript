name: pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pages.yaml
      - docs/index.html
      - packages/oxlint/__tests__/rules.html
      - packages/oxlint/__tests__/ui.css
      - packages/verax/docs/index.html
      - packages/verax/docs/repl.ts
      - packages/verax/src/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

# a newer push supersedes a queued deploy, never an in-flight one
concurrency:
  cancel-in-progress: false
  group: pages

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
      - run: bun install --frozen-lockfile
      # the docs page runs its examples on verax and docs/repl.ts, built from source
      - run: bun run --filter verax docs
      # the report is committed, generated by `bun run --filter '@jlg/oxlint' report`
      - name: site
        run: |
          mkdir -p site/oxlint site/verax
          cp docs/index.html site/
          cp packages/oxlint/__tests__/rules.html site/oxlint/index.html
          cp packages/oxlint/__tests__/ui.css site/oxlint/
          cp packages/verax/docs/index.html packages/verax/docs/build/*.js site/verax/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
