# Pre-commit: the staged slice of `bun run fmt` and `bun run lint`, same
# configs. oxfmt takes every staged file with no glob, so it formats exactly
# the file types `fmt:check` checks (md, yaml, toml, css, … — it skips what it
# cannot format). Unused disable directives are reported by .oxlintrc.json's
# `options`, so no flag is needed here.
# --no-error-on-unmatched-pattern: both tools exit non-zero when no staged file
# survives their ignores or supported types, silently aborting the commit
# (found in jlg.io 2026-07-22).

[pre-commit]
parallel = true

[pre-commit.commands.oxfmt]
run = "bunx oxfmt --no-error-on-unmatched-pattern {staged_files}"
stage_fixed = true

[pre-commit.commands.oxlint]
glob = "*.{cjs,cts,js,jsx,mjs,mts,ts,tsx}"
run = "bunx oxlint --no-error-on-unmatched-pattern {staged_files}"

# Pre-push gate: the CI check job minus its changeset guard (that one gates the
# merge, not the push), so a stale graph.lock or a red test never reaches the
# remote. `unset` the git env vars git exports into hook children, or any test
# that spawns git would point at this repo instead of its fixture.
# (since 2026-09-08 · replaces the retired ./save gate)
[pre-push.commands.gate]
run = "unset $(git rev-parse --local-env-vars); bun run lint && bun run fmt:check && bun test && stele check && stele emit --check"
