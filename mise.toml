[env]
_.file = ".env"

[tasks.check]
description = "dandori in verify mode: never writes the tree (docs/dandori.html)"
run = "bunx dandori"

[tasks."check:fix"]
description = "dandori in fix mode: oxlint --fix, then oxfmt, then verify"
run = "bunx dandori --fix"

[tools]
bun = "1.4.5"
hk = { version = "2.14.0", workflow = "release.yml" }
# local runs launch oxlint/oxfmt with `bun --bun`; ci's lint (node N) and fmt (node N) prove the configs on node 24 and 26
node = "24"
